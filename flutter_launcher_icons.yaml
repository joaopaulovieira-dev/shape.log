flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # iOS e fallback: logo com fundo escuro já embutido
  image_path: "assets/icon/logo_fundopreto.png"
  min_sdk_android: 21
  # Android adaptive icon: foreground logo + fundo #121212
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icon/logo.png"
  web:
    generate: true
    image_path: "assets/icon/logo_fundopreto.png"
    background_color: "#121212"
    theme_color: "#121212"
